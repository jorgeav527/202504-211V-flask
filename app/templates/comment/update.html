{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h3>Editar Comentario</h3>
    <form action="/comments/update/{{ comment['id'] }}" method="post">
        <div class="mb-3">
            <label class="form-label" for="content_content">Contenido</label>
            <textarea id="content_content" class="form-control" name="content_content" rows="4" required>{{ comment['content'] }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Asociar a posts</label>
            {% for post in posts %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="post_ids" value="{{ post['id'] }}" id="post_{{ post['id'] }}"
                    {% if post['id'] in selected_ids %}checked{% endif %}>
                <label class="form-check-label" for="post_{{ post['id'] }}">{{ post["title"] }}</label>
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/comments/list" class="btn btn-link">Volver</a>
    </form>
</div>
{% endblock %}
